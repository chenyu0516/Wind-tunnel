<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">Wind tunnel apparatus layout</title>
  <desc id="desc">Air moves left to right through a honeycomb and screen chamber, contraction, transparent test section, diffuser, and guarded suction fan. The model rests on roller cradles carried by a balance on its own base, separate from the ground plate and tunnel frame. Geometry is schematic.</desc>
  <defs>
    <marker id="flow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#187c91"/></marker>
    <marker id="dim" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 3 L0 0 L0 6Z" fill="#6b7280"/></marker>
    <pattern id="honeycomb" width="12" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H12V14H0Z M0 7H12" fill="none" stroke="#9cb2bd" stroke-width="1"/></pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#183344}
      .title{font-size:29px;font-weight:700}.sub{font-size:19px;fill:#526b7b}
      .label{font-size:21px;font-weight:700}.note{font-size:18px;fill:#526b7b}
      .shell{stroke:#32566b;stroke-width:3;fill:#edf3f6}
      .air{stroke:#187c91;stroke-width:3;fill:none}
      .leader{stroke:#6b8290;stroke-width:1.5;fill:none}
    </style>
  </defs>
