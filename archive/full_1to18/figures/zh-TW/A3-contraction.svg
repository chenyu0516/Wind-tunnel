<text x="128.6" y="422.0" class="n" text-anchor="start" >中心線</text>
<text x="648.0" y="230.0" class="d" text-anchor="end" >寬度方向壁</text>
<text x="648.0" y="247.0" class="d" text-anchor="end" >最大斜角 31.1°</text>
<text x="648.0" y="264.0" class="d" text-anchor="end" >最小彎曲半徑 484 mm</text>
<text x="648.0" y="610.0" class="d" text-anchor="end" >高度方向壁</text>
<text x="648.0" y="627.0" class="d" text-anchor="end" >最大斜角 24.4°</text>
<text x="648.0" y="644.0" class="d" text-anchor="end" >最小彎曲半徑 645 mm</text>
<text x="820.0" y="130.0" class="l" text-anchor="start" >曲線公式</text>
<text x="820.0" y="156.0" class="d" text-anchor="start" >h(s) = hᵢ − (hᵢ − hₑ)·(6t⁵ − 15t⁴ + 10t³)</text>
<text x="820.0" y="175.0" class="d" text-anchor="start" >t = s / L，L = 900</text>
<text x="820.0" y="194.0" class="d" text-anchor="start" >寬與高使用同一公式</text>
<text x="820.0" y="213.0" class="d" text-anchor="start" ></text>
<text x="820.0" y="232.0" class="d" text-anchor="start" >兩端：斜率 = 0、曲率 = 0</text>
<text x="820.0" y="251.0" class="d" text-anchor="start" >→ 與穩定段、測試段平順銜接，</text>
<text x="820.0" y="270.0" class="d" text-anchor="start" >   不會在接縫處產生壓力尖峰</text>
<text x="820.0" y="330.0" class="l" text-anchor="start" >製作</text>
<text x="820.0" y="356.0" class="d" text-anchor="start" >每面壁只單向彎曲 → 用 1.5–2.0 mm 平板</text>
<text x="820.0" y="375.0" class="d" text-anchor="start" >彎貼在 CNC 肋板上；四角從外側修順、密封</text>
<text x="820.0" y="394.0" class="d" text-anchor="start" >肋板數量與間距：計畫未定</text>
<text x="820.0" y="440.0" class="l" text-anchor="start" >出口接縫（放大示意）</text>
