<text x="890.0" y="500.0" class="n" text-anchor="middle" >收縮段</text>
<text x="1020.0" y="506.0" class="n" text-anchor="middle" >測試段壁</text>
<line x1="850.0" y1="550.0" x2="930.0" y2="550.0" class="air" marker-end="url(#f)"/>
<text x="830.0" y="580.0" class="d" text-anchor="start" >段差 ≤ 0.5 mm</text>
<text x="830.0" y="599.0" class="d" text-anchor="start" >若有段差：下游壁略往外退（後向台階）</text>
<text x="830.0" y="618.0" class="d" text-anchor="start" >不可做成迎風凸台</text>
<text x="950.0" y="534.0" class="w" text-anchor="start" >← 下游壁外退</text>
</svg>
