.axis{stroke:#374151;stroke-width:1.2;fill:none}
.c1{stroke:#187c91;stroke-width:2.5;fill:none} .c2{stroke:#7c3aed;stroke-width:2.5;fill:none}
.c3{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.bar{fill:#187c91} .bar2{fill:#94a3b8}
.hc{fill:url(#hc);stroke:#32566b;stroke-width:1}
</style></defs>
<rect width="1400" height="1120" rx="14" fill="#fafcfd"/>
<text x="32.0" y="42.0" class="t" text-anchor="start" >圖 A5　車輪支撐與天平（剖面）</text>
<text x="32.0" y="66.0" class="st" text-anchor="start" >上半依比例（單一車輪，側視）；下半為示意、未依比例　單位 mm</text>
<rect x="80.0" y="110.0" width="550.0" height="182.5" class="car" />
<text x="105.0" y="135.0" class="n" text-anchor="start" >車身</text>
