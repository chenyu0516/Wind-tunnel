<text x="960.0" y="960.0" class="n" text-anchor="start" >限位：阻力約 2 N、垂直 &lt; 4.5 kg</text>
<text x="960.0" y="978.0" class="n" text-anchor="start" >換車時鎖上運輸鎖</text>
<text x="960.0" y="996.0" class="n" text-anchor="start" >活動質量 ≤ 2.6 kg（垂直荷重元容量 3 kg）</text>
</svg>
