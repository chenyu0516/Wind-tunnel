<text x="960.0" y="530.0" class="n" text-anchor="start" >683ZZ（3 × 7 × 3 mm）兩端各一</text>
<text x="960.0" y="547.0" class="n" text-anchor="start" >Ø3 軸固定在托架側板</text>
<text x="960.0" y="564.0" class="n" text-anchor="start" >凸緣或側導板做橫向定位</text>
<text x="960.0" y="581.0" class="n" text-anchor="start" >滾輪長度：計畫未定</text>
<text x="1178.0" y="516.0" class="w" text-anchor="start" >長度待定</text>
<line x1="40.0" y1="666.0" x2="1360.0" y2="666.0" class="guide" />
