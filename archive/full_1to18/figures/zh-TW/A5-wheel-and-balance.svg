<text x="770.0" y="439.0" class="d halo" text-anchor="start" >輪井深 ≤ 30</text>
<line x1="764.0" y1="610.0" x2="764.0" y2="510.0" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="770.0" y="564.0" class="d halo" text-anchor="start" >護套跨距 20</text>
<text x="648.0" y="332.0" class="d halo" text-anchor="start" >地面板 6</text>
<text x="257.0" y="375.5" class="l halo" text-anchor="end" >滾輪 Ø16</text>
<text x="257.0" y="393.5" class="n halo" text-anchor="end" >2 × 683ZZ、軸 Ø3</text>
<text x="199.0" y="460.0" class="l halo" text-anchor="end" >封底輪井</text>
<text x="319.0" y="570.0" class="l halo" text-anchor="end" >固定護套管 Ø12</text>
<text x="383.0" y="660.0" class="n halo" text-anchor="start" >支柱 8 mm（屬天平）</text>
<text x="355.0" y="442.5" class="n halo" text-anchor="middle" >托架</text>
<text x="960.0" y="150.0" class="l" text-anchor="start" >滾輪與輪胎的幾何</text>
<text x="960.0" y="176.0" class="d" text-anchor="start" >輪胎 Ø40，滾輪 Ø16，中心距 20</text>
<text x="960.0" y="195.0" class="d" text-anchor="start" >→ 滾輪頂高於輪胎最低點 1.85 mm（計畫：約 1.9）</text>
<text x="960.0" y="214.0" class="d" text-anchor="start" >規則：滾輪頂 &lt; 地面板頂；車身俯仰只用托架高度調</text>
<text x="960.0" y="250.0" class="w" text-anchor="start" >待確認：滾輪頂在板面以下，</text>
<text x="960.0" y="268.0" class="w" text-anchor="start" >輪胎最低點就比地面板頂低 ≥ 1.8 mm，</text>
<text x="960.0" y="286.0" class="w" text-anchor="start" >車身離地會比原車模少約 1.8 mm（車高 7–8 的約 25%）</text>
<text x="960.0" y="304.0" class="w" text-anchor="start" >見 airflow_design.zh-TW.md §8</text>
<text x="960.0" y="360.0" class="l" text-anchor="start" >滾輪正視（示意）</text>
<rect x="1000.0" y="390.0" width="168.0" height="112.0" class="shell" />
<rect x="1000.0" y="421.5" width="21.0" height="49.0" class="solid" />
