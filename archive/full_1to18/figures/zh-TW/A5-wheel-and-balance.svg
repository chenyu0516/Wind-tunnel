<circle cx="720.0" cy="940.0" r="6.0" class="shell" />
<text x="732.0" y="944.0" class="n" text-anchor="start" >線材格蘭頭</text>
<line x1="720.0" y1="750.0" x2="800.0" y2="750.0" class="scr" />
<text x="806.0" y="754.0" class="n" text-anchor="start" >Ø6 平衡管 → 車身中段附近的側壁靜壓孔</text>
<text x="806.0" y="772.0" class="n" text-anchor="start" >靜壓箱與地面板壓差 ≤ 1 Pa</text>
<line x1="260.0" y1="680.0" x2="260.0" y2="780.0" class="dark" style="stroke-width:5;stroke:#94a3b8"/>
<line x1="600.0" y1="680.0" x2="600.0" y2="780.0" class="dark" style="stroke-width:5;stroke:#94a3b8"/>
