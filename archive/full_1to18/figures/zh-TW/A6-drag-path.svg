<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">阻力如何被量到</title>
<desc id="desc">左：輪胎坐在兩個滾輪之間時，水平力如何傳到托架；右：阻力與重量在天平中的兩條路徑。</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b7280"/></marker>
<marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#187c91"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<pattern id="hc" width="5" height="8" patternUnits="userSpaceOnUse"><path d="M0 0V8 M0 4H5" stroke="#8aa4b2" stroke-width="0.8"/></pattern>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#94a3b8" stroke-width="1"/></pattern>
<style>
text{font-family:'PingFang TC','Heiti TC','Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#183344}
.t{font-size:24px;font-weight:700} .st{font-size:14px;fill:#526b7b}
.l{font-size:14px;font-weight:600} .n{font-size:12px;fill:#526b7b} .d{font-size:12px;fill:#374151}
.w{font-size:12px;fill:#c2410c;font-weight:600}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.shell{stroke:#32566b;stroke-width:2;fill:#edf3f6}
.shell0{stroke:#32566b;stroke-width:2;fill:none}
.thin{stroke:#32566b;stroke-width:1;fill:none}
.pc{stroke:#32566b;stroke-width:2;fill:#e3f1f7}
.solid{stroke:#32566b;stroke-width:1.2;fill:#cbd5df}
.dark{stroke:#1f2937;stroke-width:1;fill:#4b5563}
.car{stroke:#475569;stroke-width:1.2;fill:#e2e8f0}
.air{stroke:#187c91;stroke-width:2;fill:none}
.airf{fill:#187c91}
.scr{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.dim{stroke:#6b7280;stroke-width:1;fill:none}
.ext{stroke:#9ca3af;stroke-width:0.8;fill:none}
.guide{stroke:#cbd5e1;stroke-width:0.8;stroke-dasharray:3 4;fill:none}
.tbd{stroke:#c2410c;stroke-width:1.4;stroke-dasharray:5 3;fill:none}
.tbdf{stroke:#c2410c;stroke-width:1.4;stroke-dasharray:5 3;fill:#fff7ed}
.cl{stroke:#94a3b8;stroke-width:1;stroke-dasharray:14 4 2 4;fill:none}
.grid{stroke:#e5e7eb;stroke-width:1;fill:none}
.axis{stroke:#374151;stroke-width:1.2;fill:none}
.c1{stroke:#187c91;stroke-width:2.5;fill:none} .c2{stroke:#7c3aed;stroke-width:2.5;fill:none}
.c3{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.bar{fill:#187c91} .bar2{fill:#94a3b8}
.hc{fill:url(#hc);stroke:#32566b;stroke-width:1}
</style></defs>
<rect width="1400" height="800" rx="14" fill="#fafcfd"/>
<text x="32.0" y="42.0" class="t" text-anchor="start" >圖 A6　水平力（阻力）如何被量到</text>
<text x="32.0" y="66.0" class="st" text-anchor="start" >左：單一車輪，依比例　右：天平堆疊，示意　氣流由左向右，阻力方向 +x</text>
<circle cx="330.0" cy="250.0" r="120.0" class="dark" style="fill:#4b5563;opacity:0.85"/>
<circle cx="270.0" cy="406.9" r="48.0" class="shell" style="fill:#cbd5df"/>
<circle cx="270.0" cy="406.9" r="9.0" class="dark" />
<line x1="270.0" y1="406.9" x2="330.0" y2="250.0" class="guide" style="stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:6 4"/>
<circle cx="390.0" cy="406.9" r="48.0" class="shell" style="fill:#cbd5df"/>
<circle cx="390.0" cy="406.9" r="9.0" class="dark" />
<line x1="390.0" y1="406.9" x2="330.0" y2="250.0" class="guide" style="stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:6 4"/>
<line x1="210.0" y1="472.9" x2="450.0" y2="472.9" class="shell0" style="stroke-width:4"/>
<line x1="210.0" y1="406.9" x2="210.0" y2="472.9" class="shell0" style="stroke-width:4"/>
<line x1="450.0" y1="406.9" x2="450.0" y2="472.9" class="shell0" style="stroke-width:4"/>
<text x="330.0" y="494.9" class="n" text-anchor="middle" >托架（固定在共用框架上）</text>
<line x1="330.0" y1="250.0" x2="330.0" y2="330.0" class="air" style="stroke:#1f2937;stroke-width:3" marker-end="url(#a)"/>
<text x="338.0" y="326.0" class="l halo" text-anchor="start" >重量 W</text>
<line x1="330.0" y1="250.0" x2="490.0" y2="250.0" class="air" style="stroke-width:3" marker-end="url(#f)"/>
<text x="494.0" y="255.0" class="l halo" text-anchor="start" >阻力 D</text>
<line x1="271.1" y1="320.1" x2="287.1" y2="362.1" class="air" style="stroke:#7c3aed;stroke-width:3"/>
<text x="263.1" y="338.1" class="l halo" text-anchor="end" >N₁（上游）</text>
<line x1="397.9" y1="296.7" x2="372.9" y2="362.1" class="air" style="stroke:#7c3aed;stroke-width:3"/>
<text x="405.9" y="314.7" class="l halo" text-anchor="start" >N₂（下游）</text>
<text x="420.0" y="402.9" class="d halo" text-anchor="start" >φ = 20.9°</text>
<text x="40.0" y="580.0" class="d" text-anchor="start" >接觸力永遠沿著「滾輪中心 → 輪胎中心」的方向（紫色虛線）。</text>
<text x="40.0" y="601.0" class="d" text-anchor="start" >兩條線都斜 φ = 20.9°，所以接觸力有水平分量：D = (N₂ − N₁)·sin φ</text>
<text x="40.0" y="622.0" class="d" text-anchor="start" >阻力只是把重量多分一點給下游滾輪，托架照樣把水平力接住。</text>
<text x="40.0" y="643.0" class="d" text-anchor="start" >滾輪與輪胎轉動不會讓輪胎平移：要平移，輪胎中心必須先爬高。</text>
<text x="40.0" y="664.0" class="d" text-anchor="start" >爬出條件：N₁ = 0，即 D/W = tan φ = 0.38，整車約 4.6 N；15 m/s 阻力只有約 0.3 N。</text>
<text x="40.0" y="685.0" class="d" text-anchor="start" >量測時仍鎖住滾輪（計畫 B3），排除任何滾動或晃動。</text>
<rect x="820.0" y="120.0" width="400.0" height="26.0" class="solid" />
<text x="1020.0" y="138.0" class="n" text-anchor="middle" >共用框架（4 個托架都鎖在上面）</text>
<rect x="862.0" y="92.0" width="36.0" height="28.0" class="shell" style="fill:#cbd5df"/>
<rect x="1142.0" y="92.0" width="36.0" height="28.0" class="shell" style="fill:#cbd5df"/>
<text x="1020.0" y="104.0" class="n" text-anchor="middle" >托架 ×4</text>
<rect x="870.0" y="170.0" width="300.0" height="16.0" class="solid" />
<text x="1180.0" y="182.0" class="n" text-anchor="start" >上板</text>
<line x1="1020.0" y1="146.0" x2="1020.0" y2="170.0" class="shell0" style="stroke-width:5"/>
<line x1="890.0" y1="186.0" x2="890.0" y2="286.0" class="shell0" style="stroke:#7c3aed;stroke-width:3"/>
<line x1="1150.0" y1="186.0" x2="1150.0" y2="286.0" class="shell0" style="stroke:#7c3aed;stroke-width:3"/>
<rect x="870.0" y="286.0" width="300.0" height="16.0" class="solid" />
<text x="1180.0" y="298.0" class="n" text-anchor="start" >底板</text>
<rect x="980.0" y="222.0" width="70.0" height="26.0" class="shell" style="fill:#fde68a"/>
<line x1="960.0" y1="186.0" x2="960.0" y2="235.0" class="shell0" style="stroke-width:4"/>
<line x1="960.0" y1="235.0" x2="980.0" y2="235.0" class="shell0" style="stroke-width:4"/>
<line x1="1050.0" y1="235.0" x2="1080.0" y2="235.0" class="shell0" style="stroke-width:4"/>
<line x1="1080.0" y1="235.0" x2="1080.0" y2="286.0" class="shell0" style="stroke-width:4"/>
<text x="1015.0" y="215.0" class="n" text-anchor="middle" >阻力荷重元</text>
<text x="880.0" y="270.0" class="n" text-anchor="end" >鋼片</text>
<line x1="1020.0" y1="302.0" x2="1020.0" y2="330.0" class="shell0" style="stroke-width:5"/>
<rect x="930.0" y="330.0" width="180.0" height="26.0" class="shell" style="fill:#fde68a"/>
<text x="1020.0" y="348.0" class="n" text-anchor="middle" >垂直荷重元</text>
<rect x="985.0" y="356.0" width="70.0" height="70.0" class="solid" />
<text x="1065.0" y="400.0" class="n" text-anchor="start" >落地底座</text>
<path d="M800,105 L800,178 L940,178 L940,235" class="c1" marker-end="url(#f)"/>
<text x="790.0" y="100.0" class="l halo" text-anchor="end" >阻力路徑</text>
<path d="M1250,105 L1250,240 L1200,240 L1200,343 L1115,343" class="c2" marker-end="url(#a)"/>
<text x="1258.0" y="100.0" class="l halo" text-anchor="start" >重量路徑</text>
<text x="730.0" y="470.0" class="d" text-anchor="start" >兩個平台疊在一起，不是滾輪自己去動：</text>
<text x="730.0" y="491.0" class="d" text-anchor="start" >• 托架鎖死在共用框架上，整個框架一起動。</text>
<text x="730.0" y="512.0" class="d" text-anchor="start" >• 鋼片把上板吊在底板上：垂直方向極硬（直接承重），</text>
<text x="730.0" y="533.0" class="d" text-anchor="start" >  水平方向很軟（約 2,000 N/m），讓上板能前後移動。</text>
<text x="730.0" y="554.0" class="d" text-anchor="start" >• 上板前後移動時只能推阻力荷重元 → 讀到阻力。</text>
<text x="730.0" y="575.0" class="d" text-anchor="start" >• 整個阻力平台再坐在垂直荷重元上 → 讀到重量 + 下壓力。</text>
<text x="730.0" y="596.0" class="d" text-anchor="start" ></text>
<text x="730.0" y="617.0" class="d" text-anchor="start" >阻力荷重元剛性約 9,810 N/m（假設滿載變形 0.3 mm），</text>
<text x="730.0" y="638.0" class="d" text-anchor="start" >與鋼片並聯 → 荷重元承受約 83%，其餘由鋼片承受；</text>
<text x="730.0" y="659.0" class="d" text-anchor="start" >這個比例固定，組裝後的力校正（F1）會一併扣除。</text>
<text x="730.0" y="680.0" class="d" text-anchor="start" >0.3 N 阻力只讓框架水平移動約 25 µm（間隙 1–2 mm）。</text>
<text x="730.0" y="701.0" class="d" text-anchor="start" >同一組彈簧也決定阻力方向自然頻率約 11 Hz（計畫 C4）。</text>
</svg>
