<text x="365.1" y="680.6" class="n" text-anchor="middle" >s（mm）</text>
<text x="76.2" y="704.6" class="n" text-anchor="start" >標示值為全寬（上）與全高（下）＝肋板外形尺寸</text>
<text x="760.0" y="130.0" class="l" text-anchor="start" >曲線公式（與完整版相同）</text>
<text x="760.0" y="156.0" class="d" text-anchor="start" >h(s) = hᵢ − (hᵢ − hₑ)·(6t⁵ − 15t⁴ + 10t³)</text>
<text x="760.0" y="175.0" class="d" text-anchor="start" >t = s / L，L = 378</text>
<text x="760.0" y="194.0" class="d" text-anchor="start" >兩端斜率 = 0、曲率 = 0 → 平順銜接</text>
<text x="760.0" y="240.0" class="d" text-anchor="start" >寬度方向壁：最大斜角 31.2°，最小彎曲半徑 203 mm</text>
<text x="760.0" y="300.0" class="d" text-anchor="start" >高度方向壁：最大斜角 24.4°，最小彎曲半徑 270 mm</text>
<text x="760.0" y="360.0" class="l" text-anchor="start" >製作</text>
<text x="760.0" y="386.0" class="d" text-anchor="start" >每面壁只單向彎曲：0.5–1 mm PET／PC 薄板</text>
<text x="760.0" y="405.0" class="d" text-anchor="start" >彎貼在夾板或 MDF 肋板上（上表站位即肋板）</text>
<text x="760.0" y="424.0" class="d" text-anchor="start" >四角用熱熔膠或膠帶從外側密封</text>
<text x="760.0" y="443.0" class="d" text-anchor="start" >出口段差 ≤ 0.3 mm，只能是後向台階</text>
