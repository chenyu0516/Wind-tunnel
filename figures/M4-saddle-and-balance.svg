<text x="670.0" y="350.0" class="d halo" text-anchor="start" >地面板 3</text>
<text x="297.5" y="437.8" class="l halo" text-anchor="end" >V 形托座</text>
<text x="217.0" y="462.0" class="l halo" text-anchor="end" >封底輪井</text>
<text x="332.5" y="572.0" class="n halo" text-anchor="end" >護套管 Ø5（固定在風洞）</text>
<text x="390.5" y="649.0" class="n halo" text-anchor="start" >支柱 Ø3（屬天平）</text>
<text x="860.0" y="140.0" class="l" text-anchor="start" >托座幾何</text>
<text x="860.0" y="166.0" class="d" text-anchor="start" >兩個接觸面與水平夾 20.9°（接觸力與垂直夾同角）</text>
<text x="860.0" y="186.0" class="d" text-anchor="start" >脫出條件：水平力 / 重量 = tan φ = 0.38</text>
<text x="860.0" y="206.0" class="d" text-anchor="start" >輪胎最低點比接觸點低 0.53 mm</text>
<text x="860.0" y="226.0" class="d" text-anchor="start" >規則：接觸點低於地面板頂；俯仰只用托座墊片調</text>
<text x="860.0" y="246.0" class="d" text-anchor="start" >托座可 3D 列印（PETG）或鋁塊銑 V 槽</text>
<text x="860.0" y="290.0" class="w" text-anchor="start" >待確認：車身離地會少約 0.5 mm</text>
<text x="860.0" y="309.0" class="w" text-anchor="start" >（1:43 車高約 3 mm，約 18%）</text>
<text x="860.0" y="328.0" class="w" text-anchor="start" >量測時記錄實際車高即可</text>
<line x1="40.0" y1="686.0" x2="1360.0" y2="686.0" class="guide" />
<text x="40.0" y="706.0" class="w" text-anchor="start" >以下為示意，未依比例：測試段地板下方</text>
<path d="M380,1040 L140,1040 L140,740 L720,740 L720,1040 L480,1040" class="shell0" style="stroke-width:4"/>
