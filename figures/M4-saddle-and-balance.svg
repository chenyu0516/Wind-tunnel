<text x="672.0" y="504.5" class="d halo" text-anchor="start" >板下 21</text>
<line x1="776.0" y1="517.0" x2="776.0" y2="385.0" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="782.0" y="455.0" class="d halo" text-anchor="start" >輪井 ≤ 12</text>
<line x1="776.0" y1="616.0" x2="776.0" y2="517.0" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="782.0" y="570.5" class="d halo" text-anchor="start" >護套 9</text>
<text x="670.0" y="350.0" class="d halo" text-anchor="start" >地面板 3</text>
<text x="297.5" y="437.8" class="l halo" text-anchor="end" >V 形托座</text>
<text x="217.0" y="462.0" class="l halo" text-anchor="end" >封底輪井</text>
<text x="332.5" y="572.0" class="n halo" text-anchor="end" >護套管 Ø5（固定在風洞）</text>
<text x="390.5" y="649.0" class="n halo" text-anchor="start" >支柱 Ø3（屬天平）</text>
<text x="860.0" y="140.0" class="l" text-anchor="start" >托座幾何</text>
<text x="860.0" y="166.0" class="d" text-anchor="start" >兩個接觸面與水平夾 20.9°（接觸力與垂直夾同角）</text>
<text x="860.0" y="186.0" class="d" text-anchor="start" >脫出條件：水平力 / 重量 = tan φ = 0.38</text>
<text x="860.0" y="206.0" class="d" text-anchor="start" >輪胎最低點比接觸點低 0.53 mm</text>
<text x="860.0" y="226.0" class="d" text-anchor="start" >規則：接觸點低於地面板頂；俯仰只用托座墊片調</text>
<text x="860.0" y="246.0" class="d" text-anchor="start" >托座可 3D 列印（PETG）或鋁塊銑 V 槽</text>
<text x="860.0" y="290.0" class="w" text-anchor="start" >待確認：車身離地會少約 0.5 mm</text>
<text x="860.0" y="309.0" class="w" text-anchor="start" >（1:43 車高約 3 mm，約 18%）</text>
<text x="860.0" y="328.0" class="w" text-anchor="start" >量測時記錄實際車高即可</text>
<line x1="40.0" y1="686.0" x2="1360.0" y2="686.0" class="guide" />
<text x="40.0" y="706.0" class="w" text-anchor="start" >以下為示意，未依比例：測試段地板下方</text>
<path d="M140,740 L140,1040 L720,1040 L720,740" class="shell0" style="stroke-width:4"/>
<rect x="136.0" y="734.0" width="588.0" height="6.0" class="solid" />
<text x="732.0" y="758.0" class="l" text-anchor="start" >天平箱 180×168×86（側壁即測試段側板，3 mm 壓克力）</text>
<text x="732.0" y="780.0" class="n" text-anchor="start" >只經輪井與測試段相通，不需平衡管</text>
<rect x="140.0" y="1028.0" width="580.0" height="12.0" class="solid" style="fill:#d6c3a1"/>
<text x="732.0" y="1038.0" class="n" text-anchor="start" >底板 = 可抽出托盤，整組天平鎖在上面</text>
<circle cx="720.0" cy="890.0" r="6.0" class="shell" />
<text x="732.0" y="894.0" class="n" text-anchor="start" >線材孔（熱熔膠封）→ HX711 ×2 在箱外</text>
<rect x="164.0" y="1040.0" width="12.0" height="22.0" class="dark" />
<rect x="684.0" y="1040.0" width="12.0" height="22.0" class="dark" />
<text x="700.0" y="1092.0" class="n" text-anchor="start" >M6 調整腳 ×4（裝在托盤）</text>
<line x1="330.0" y1="710.0" x2="330.0" y2="810.0" class="dark" style="stroke-width:5;stroke:#94a3b8"/>
<line x1="560.0" y1="710.0" x2="560.0" y2="810.0" class="dark" style="stroke-width:5;stroke:#94a3b8"/>
<text x="568.0" y="722.0" class="n" text-anchor="start" >支柱 ×4</text>
<rect x="250.0" y="810.0" width="380.0" height="14.0" class="solid" style="fill:#d6c3a1"/>
<text x="732.0" y="822.0" class="n" text-anchor="start" >共用框架（2 × 3 mm 合板）</text>
<rect x="300.0" y="824.0" width="40.0" height="12.0" class="shell" style="fill:#f59e0b"/>
<rect x="300.0" y="836.0" width="300.0" height="20.0" class="shell" style="fill:#fde68a"/>
<text x="450.0" y="851.0" class="n" text-anchor="middle" >垂直荷重元 1 kg（平放）</text>
<path d="M540,856 L620,856 L620,890 L600,890 L600,868 L540,868 Z" class="shell" style="fill:#f59e0b"/>
<text x="535.0" y="886.0" class="n" text-anchor="end" >角架（3D 列印）</text>
<rect x="580.0" y="890.0" width="20.0" height="110.0" class="shell" style="fill:#fde68a"/>
<text x="572.0" y="940.0" class="n" text-anchor="end" >阻力荷重元 100 g（直立）</text>
<text x="572.0" y="958.0" class="n" text-anchor="end" >感測前後方向</text>
<rect x="552.0" y="986.0" width="28.0" height="18.0" class="shell" style="fill:#f59e0b"/>
<rect x="220.0" y="1014.0" width="440.0" height="14.0" class="solid" style="fill:#d6c3a1"/>
<text x="400.0" y="1010.0" class="n" text-anchor="start" >天平底板</text>
<rect x="262.0" y="840.0" width="22.0" height="174.0" class="shell" style="fill:#f59e0b"/>
<rect x="259.0" y="828.0" width="28.0" height="6.0" class="dark" />
<text x="256.0" y="880.0" class="n" text-anchor="end" >下限位 M4 螺絲（間隙 0.3 mm）</text>
<text x="148.0" y="1120.0" class="n" text-anchor="start" >受力路徑：車 → 托座 → 支柱 → 框架 → 垂直荷重元 → 角架 → 阻力荷重元 → 底座 → 托盤</text>
<rect x="60.0" y="1062.0" width="1280.0" height="12.0" class="solid" style="fill:url(#hatch)"/>
<text x="70.0" y="1058.0" class="n" text-anchor="start" >桌面</text>
<text x="960.0" y="926.0" class="n" text-anchor="start" >限位：阻力 0.6 N、垂直 0.9 kg</text>
<text x="960.0" y="944.0" class="n" text-anchor="start" >活動質量 ≤ 0.6 kg</text>
<text x="960.0" y="962.0" class="n" text-anchor="start" >阻力方向自然頻率約 14 Hz</text>
<text x="960.0" y="980.0" class="n" text-anchor="start" >阻力荷重元承受全部阻力（無滑軌）</text>
<text x="960.0" y="998.0" class="n" text-anchor="start" >需 2 × 2 交叉校正</text>
<text x="960.0" y="1016.0" class="n" text-anchor="start" >前後限位：叉座 + 2 支 M3 螺絲（間隙 0.3 mm）</text>
</svg>
