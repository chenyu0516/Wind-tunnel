<rect width="1400" height="1180" rx="14" fill="#fafcfd"/>
<text x="32.0" y="42.0" class="t" text-anchor="start" >圖 M4　車輪 V 形托座與天平（剖面）</text>
<text x="32.0" y="66.0" class="st" text-anchor="start" >上半依比例（單一車輪，側視）；下半為示意、未依比例　單位 mm</text>
<rect x="80.0" y="352.0" width="176.0" height="33.0" class="solid" />
