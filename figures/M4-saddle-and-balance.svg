<text x="806.0" y="784.0" class="n" text-anchor="start" >Ø4 平衡管 → 側壁平衡孔（x = 178）</text>
<line x1="260.0" y1="710.0" x2="260.0" y2="810.0" class="dark" style="stroke-width:5;stroke:#94a3b8"/>
<line x1="600.0" y1="710.0" x2="600.0" y2="810.0" class="dark" style="stroke-width:5;stroke:#94a3b8"/>
<text x="608.0" y="722.0" class="n" text-anchor="start" >支柱 ×4</text>
<rect x="230.0" y="810.0" width="400.0" height="14.0" class="solid" />
<text x="640.0" y="822.0" class="n" text-anchor="start" >共用框架（鋁條或 3 mm 板）</text>
<rect x="330.0" y="840.0" width="200.0" height="12.0" class="solid" />
<line x1="340.0" y1="852.0" x2="340.0" y2="900.0" class="shell0" style="stroke-width:2;stroke:#7c3aed"/>
<line x1="520.0" y1="852.0" x2="520.0" y2="900.0" class="shell0" style="stroke-width:2;stroke:#7c3aed"/>
<text x="540.0" y="880.0" class="n" text-anchor="start" >厚薄規鋼片 ×4（0.1 × 10 × 20）</text>
<rect x="330.0" y="900.0" width="200.0" height="12.0" class="solid" />
<rect x="390.0" y="868.0" width="60.0" height="18.0" class="shell" style="fill:#fde68a"/>
<text x="380.0" y="881.0" class="n" text-anchor="end" >阻力荷重元 100 g（水平）</text>
<rect x="360.0" y="930.0" width="140.0" height="22.0" class="shell" style="fill:#fde68a"/>
<text x="350.0" y="945.0" class="n" text-anchor="end" >垂直荷重元 1 kg</text>
<line x1="430.0" y1="912.0" x2="430.0" y2="930.0" class="shell0" style="stroke-width:4"/>
<rect x="405.0" y="952.0" width="50.0" height="128.0" class="solid" />
<path d="M380,1040 q4,8 12,10 q8,4 13,12 M480,1040 q-4,8 -12,10 q-8,4 -13,12" class="shell0" style="stroke:#7c3aed;stroke-width:2"/>
<text x="490.0" y="1066.0" class="n" text-anchor="start" >薄橡膠裙邊（手套或氣球膜）</text>
<rect x="340.0" y="1080.0" width="180.0" height="30.0" class="solid" style="fill:#9ca3af"/>
<text x="530.0" y="1100.0" class="n" text-anchor="start" >底座 + 配重約 5 kg（磚塊或書）</text>
<rect x="60.0" y="1110.0" width="1280.0" height="12.0" class="solid" style="fill:url(#hatch)"/>
<text x="70.0" y="1106.0" class="n" text-anchor="start" >桌面或地板（不要放在風洞框架上）</text>
<text x="960.0" y="950.0" class="n" text-anchor="start" >限位：阻力 0.6 N、垂直 0.9 kg</text>
<text x="960.0" y="968.0" class="n" text-anchor="start" >活動質量 ≤ 0.6 kg</text>
<text x="960.0" y="986.0" class="n" text-anchor="start" >阻力方向自然頻率約 16 Hz</text>
<text x="960.0" y="1004.0" class="n" text-anchor="start" >荷重元承受約 83% 阻力（校正扣除）</text>
