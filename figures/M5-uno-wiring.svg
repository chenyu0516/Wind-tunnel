<circle cx="95.0" cy="485.0" r="26.0" class="thin" />
<text x="170.0" y="480.0" class="l" text-anchor="middle" >風扇 3（4 線 PWM）</text>
<text x="170.0" y="500.0" class="n" text-anchor="middle" >12V · GND · 轉速 · PWM</text>
<line x1="260.0" y1="458.0" x2="460.0" y2="458.0" class="thin" style="stroke:#dc2626;stroke-width:3"/>
<line x1="260.0" y1="510.0" x2="300.0" y2="510.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<rect x="60.0" y="545.0" width="200.0" height="70.0" class="shell" rx="8"/>
<circle cx="95.0" cy="580.0" r="26.0" class="thin" />
<text x="170.0" y="575.0" class="l" text-anchor="middle" >風扇 4（4 線 PWM）</text>
<text x="170.0" y="595.0" class="n" text-anchor="middle" >12V · GND · 轉速 · PWM</text>
<line x1="260.0" y1="553.0" x2="460.0" y2="553.0" class="thin" style="stroke:#dc2626;stroke-width:3"/>
<line x1="260.0" y1="605.0" x2="300.0" y2="605.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
