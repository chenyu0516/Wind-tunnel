<line x1="300.0" y1="225.0" x2="300.0" y2="605.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<line x1="300.0" y1="225.0" x2="600.0" y2="225.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
