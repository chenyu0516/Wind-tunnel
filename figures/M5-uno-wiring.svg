.c3{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.bar{fill:#187c91} .bar2{fill:#94a3b8}
.hc{fill:url(#hc);stroke:#32566b;stroke-width:1}
</style></defs>
<rect width="1400" height="960" rx="14" fill="#fafcfd"/>
<text x="32.0" y="42.0" class="t" text-anchor="start" >圖 M5　Arduino Uno 接線圖</text>
<text x="32.0" y="66.0" class="st" text-anchor="start" >紅：12 V　黑：GND　藍：訊號　綠：I²C　所有 GND 必須共地；風扇電源不可取自 Uno</text>
<rect x="600.0" y="150.0" width="240.0" height="600.0" class="shell" rx="10" style="fill:#e0f2fe"/>
<text x="720.0" y="180.0" class="t" text-anchor="middle" >Arduino Uno R3</text>
