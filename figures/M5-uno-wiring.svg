<text x="828.0" y="424.0" class="l" text-anchor="end" >A0</text>
<text x="828.0" y="474.0" class="l" text-anchor="end" >A1</text>
<text x="828.0" y="524.0" class="l" text-anchor="end" >D11</text>
<text x="828.0" y="574.0" class="l" text-anchor="end" >D12</text>
<text x="828.0" y="624.0" class="l" text-anchor="end" >A4</text>
<text x="828.0" y="674.0" class="l" text-anchor="end" >A5</text>
<text x="720.0" y="710.0" class="n" text-anchor="middle" >5V / GND → 感測器</text>
<text x="720.0" y="730.0" class="n" text-anchor="middle" >USB → 筆電（供電 + CSV）</text>
<rect x="40.0" y="120.0" width="150.0" height="60.0" class="solid" rx="6"/>
<text x="115.0" y="148.0" class="l" text-anchor="middle" >12 V 電源</text>
<text x="115.0" y="166.0" class="n" text-anchor="middle" >≥ 20 A（可用舊 ATX）</text>
<rect x="220.0" y="130.0" width="80.0" height="40.0" class="shell" rx="6" style="fill:#fee2e2"/>
<text x="260.0" y="155.0" class="n" text-anchor="middle" >保險絲 25 A</text>
