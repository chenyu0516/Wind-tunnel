<line x1="260.0" y1="268.0" x2="460.0" y2="268.0" class="thin" style="stroke:#dc2626;stroke-width:3"/>
<line x1="260.0" y1="320.0" x2="300.0" y2="320.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
