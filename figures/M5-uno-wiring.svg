<text x="480.0" y="419.0" class="n" text-anchor="start" >轉速 2 → D3</text>
<rect x="470.0" y="640.0" width="110.0" height="40.0" class="shell" rx="6"/>
<text x="525.0" y="665.0" class="n" text-anchor="middle" >艙蓋安全開關</text>
<path d="M525,640 L525,600 L600,600" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<line x1="60.0" y1="800.0" x2="860.0" y2="800.0" class="thin" style="stroke:#111827;stroke-width:3"/>
<text x="70.0" y="790.0" class="n" text-anchor="start" >GND：12 V 電源 GND、風扇 GND、Uno GND 接在一起（共地）</text>
<text x="70.0" y="822.0" class="w" text-anchor="start" >急停切斷的是 12 V（硬體），不依賴 Uno 程式</text>
<rect x="940.0" y="198.0" width="210.0" height="82.0" class="shell" rx="6" style="fill:#fef9c3"/>
<text x="1045.0" y="224.0" class="l" text-anchor="middle" >HX711（阻力）</text>
<text x="1045.0" y="244.0" class="n" text-anchor="middle" >DT=D4  SCK=D5</text>
<text x="1045.0" y="264.0" class="n" text-anchor="middle" >→ 100 g 荷重元</text>
<line x1="840.0" y1="220.0" x2="940.0" y2="220.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<line x1="840.0" y1="270.0" x2="940.0" y2="270.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<rect x="940.0" y="298.0" width="210.0" height="82.0" class="shell" rx="6" style="fill:#fef9c3"/>
<text x="1045.0" y="324.0" class="l" text-anchor="middle" >HX711（垂直）</text>
<text x="1045.0" y="344.0" class="n" text-anchor="middle" >DT=D6  SCK=D7</text>
<text x="1045.0" y="364.0" class="n" text-anchor="middle" >→ 1 kg 荷重元</text>
<line x1="840.0" y1="320.0" x2="940.0" y2="320.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<line x1="840.0" y1="370.0" x2="940.0" y2="370.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<rect x="940.0" y="398.0" width="210.0" height="82.0" class="shell" rx="6" style="fill:#fef9c3"/>
<text x="1045.0" y="424.0" class="l" text-anchor="middle" >HX711 #3（風速 A）</text>
<text x="1045.0" y="444.0" class="n" text-anchor="middle" >DT=A0  SCK=A1</text>
<text x="1045.0" y="464.0" class="n" text-anchor="middle" >→ 鐘罩壓力計 100 g</text>
<line x1="840.0" y1="420.0" x2="940.0" y2="420.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<line x1="840.0" y1="470.0" x2="940.0" y2="470.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<line x1="840.0" y1="520.0" x2="940.0" y2="520.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<text x="948.0" y="524.0" class="n" text-anchor="start" >MOSFET → 霧化器（選配）</text>
<line x1="840.0" y1="570.0" x2="940.0" y2="570.0" class="thin" style="stroke:#2563eb;stroke-width:2"/>
<text x="948.0" y="574.0" class="n" text-anchor="start" >MOSFET → 12 V LED 燈條（選配）</text>
<path d="M840,620 L880,620 L880,870" class="thin" style="stroke:#16a34a;stroke-width:2.5"/>
<path d="M840,670 L900,670 L900,870" class="thin" style="stroke:#16a34a;stroke-width:2.5"/>
<text x="876.0" y="614.0" class="n" text-anchor="end" >SDA</text>
<text x="904.0" y="664.0" class="n" text-anchor="start" >SCL</text>
<rect x="940.0" y="720.0" width="240.0" height="70.0" class="shell" rx="6" style="fill:#dcfce7"/>
<text x="1060.0" y="748.0" class="l" text-anchor="middle" >BMP280 × 2（風速 B）</text>
<text x="1060.0" y="770.0" class="n" text-anchor="middle" >I²C 0x76 低壓、0x77 高壓</text>
<line x1="880.0" y1="742.0" x2="940.0" y2="742.0" class="thin" style="stroke:#16a34a;stroke-width:2.5"/>
<line x1="900.0" y1="766.0" x2="940.0" y2="766.0" class="thin" style="stroke:#16a34a;stroke-width:2.5"/>
<rect x="940.0" y="820.0" width="240.0" height="70.0" class="shell" rx="6" style="fill:#dcfce7"/>
<text x="1060.0" y="848.0" class="l" text-anchor="middle" >LCD 1602（選配）</text>
<text x="1060.0" y="870.0" class="n" text-anchor="middle" >I²C 0x27 · 顯示風速與力</text>
<line x1="880.0" y1="842.0" x2="940.0" y2="842.0" class="thin" style="stroke:#16a34a;stroke-width:2.5"/>
<line x1="900.0" y1="866.0" x2="940.0" y2="866.0" class="thin" style="stroke:#16a34a;stroke-width:2.5"/>
<text x="1190.0" y="730.0" class="n" text-anchor="start" >選 5 V 可用的模組</text>
<text x="1190.0" y="748.0" class="n" text-anchor="start" >（板上有穩壓與電平轉換）</text>
<text x="1190.0" y="766.0" class="n" text-anchor="start" >管路見圖 M7</text>
<text x="1190.0" y="784.0" class="n" text-anchor="start" >每次開風扇前先歸零</text>
<text x="40.0" y="880.0" class="n" text-anchor="start" >D10 保留不用（與 D9 共用 Timer1）；D13 板上狀態燈</text>
<text x="40.0" y="906.0" class="n" text-anchor="start" >程式：讀 q → PID 調 PWM 定速；自動跑「歸零 → 升速 → 穩定 60 s → 擷取 30 s → 停機 → 再歸零」；每筆 CSV 經 USB 傳到筆電</text>
</svg>
