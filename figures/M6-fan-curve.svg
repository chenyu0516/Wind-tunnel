<line x1="90.0" y1="129.8" x2="758.9" y2="560.0" class="c2" />
<circle cx="557.0" cy="430.2" r="5.0" class="shell" style="fill:#187c91"/>
<text x="565.0" y="422.2" class="d halo" text-anchor="start" >PWM 100% → 15.8 m/s</text>
<line x1="90.0" y1="284.7" x2="625.1" y2="560.0" class="c2" />
<circle cx="463.6" cy="476.9" r="5.0" class="shell" style="fill:#187c91"/>
<text x="471.6" y="468.9" class="d halo" text-anchor="start" >PWM 80% → 12.6 m/s</text>
<line x1="90.0" y1="405.1" x2="491.3" y2="560.0" class="c2" />
<circle cx="370.2" cy="513.3" r="5.0" class="shell" style="fill:#187c91"/>
<text x="378.2" y="505.3" class="d halo" text-anchor="start" >PWM 60% → 9.5 m/s</text>
<line x1="90.0" y1="491.2" x2="357.6" y2="560.0" class="c2" />
<circle cx="276.8" cy="539.2" r="5.0" class="shell" style="fill:#187c91"/>
<text x="284.8" y="531.2" class="d halo" text-anchor="start" >PWM 40% → 6.3 m/s</text>
<text x="850.0" y="130.0" class="l" text-anchor="start" >怎麼讀</text>
<text x="850.0" y="156.0" class="d" text-anchor="start" >紫線：風扇能給的壓力（轉速越低越往左下）</text>
<text x="850.0" y="177.0" class="d" text-anchor="start" >藍線：風洞在各流量下需要的壓力</text>
<text x="850.0" y="198.0" class="d" text-anchor="start" >交點：實際會跑到的風速</text>
<text x="850.0" y="219.0" class="d" text-anchor="start" ></text>
<text x="850.0" y="240.0" class="d" text-anchor="start" >5 m/s 約需 PWM 32%</text>
<text x="850.0" y="261.0" class="d" text-anchor="start" >10 m/s 約需 PWM 63%（課堂展示）</text>
<text x="850.0" y="282.0" class="d" text-anchor="start" >14 m/s 約需 PWM 89%</text>
<text x="850.0" y="303.0" class="d" text-anchor="start" ></text>
<text x="850.0" y="324.0" class="d" text-anchor="start" >PWM 只是起點：Arduino 會讀壓差、</text>
<text x="850.0" y="345.0" class="d" text-anchor="start" >用 PID 自動調到目標風速</text>
<text x="850.0" y="366.0" class="d" text-anchor="start" ></text>
<text x="850.0" y="387.0" class="d" text-anchor="start" >直線只是粗估，真實曲線可能較低；</text>
<text x="850.0" y="408.0" class="d" text-anchor="start" >裝好後用 PWM 掃描實測一次</text>
</svg>
