<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title desc">
<title id="title">風扇曲線與系統曲線</title>
<desc id="desc">4 個 120 mm 風扇在不同 PWM 下的估計曲線，與迷你風洞系統曲線的交點。</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b7280"/></marker>
<marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#187c91"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<pattern id="hc" width="5" height="8" patternUnits="userSpaceOnUse"><path d="M0 0V8 M0 4H5" stroke="#8aa4b2" stroke-width="0.8"/></pattern>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#94a3b8" stroke-width="1"/></pattern>
<style>
text{font-family:'PingFang TC','Heiti TC','Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#183344}
.t{font-size:24px;font-weight:700} .st{font-size:14px;fill:#526b7b}
.l{font-size:14px;font-weight:600} .n{font-size:12px;fill:#526b7b} .d{font-size:12px;fill:#374151}
.w{font-size:12px;fill:#c2410c;font-weight:600}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.shell{stroke:#32566b;stroke-width:2;fill:#edf3f6}
.shell0{stroke:#32566b;stroke-width:2;fill:none}
.thin{stroke:#32566b;stroke-width:1;fill:none}
.pc{stroke:#32566b;stroke-width:2;fill:#e3f1f7}
.solid{stroke:#32566b;stroke-width:1.2;fill:#cbd5df}
.dark{stroke:#1f2937;stroke-width:1;fill:#4b5563}
.car{stroke:#475569;stroke-width:1.2;fill:#e2e8f0}
.air{stroke:#187c91;stroke-width:2;fill:none}
.airf{fill:#187c91}
.scr{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.dim{stroke:#6b7280;stroke-width:1;fill:none}
.ext{stroke:#9ca3af;stroke-width:0.8;fill:none}
.guide{stroke:#cbd5e1;stroke-width:0.8;stroke-dasharray:3 4;fill:none}
.tbd{stroke:#c2410c;stroke-width:1.4;stroke-dasharray:5 3;fill:none}
.tbdf{stroke:#c2410c;stroke-width:1.4;stroke-dasharray:5 3;fill:#fff7ed}
.cl{stroke:#94a3b8;stroke-width:1;stroke-dasharray:14 4 2 4;fill:none}
.grid{stroke:#e5e7eb;stroke-width:1;fill:none}
.axis{stroke:#374151;stroke-width:1.2;fill:none}
.c1{stroke:#187c91;stroke-width:2.5;fill:none} .c2{stroke:#7c3aed;stroke-width:2.5;fill:none}
.c3{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.bar{fill:#187c91} .bar2{fill:#94a3b8}
.hc{fill:url(#hc);stroke:#32566b;stroke-width:1}
</style></defs>
<rect width="1240" height="640" rx="14" fill="#fafcfd"/>
<text x="32.0" y="42.0" class="t" text-anchor="start" >圖 M6　風扇陣列 vs 風洞系統曲線（估計）</text>
<text x="32.0" y="66.0" class="st" text-anchor="start" >直線：4 個風扇並聯，依官方最大風量與最大靜壓連線（實際曲線待量測）　藍色拋物線：風洞需要的壓力</text>
<line x1="90.0" y1="560.0" x2="90.0" y2="120.0" class="grid" />
<text x="90.0" y="578.0" class="d" text-anchor="middle" >0</text>
<line x1="206.7" y1="560.0" x2="206.7" y2="120.0" class="grid" />
<text x="206.7" y="578.0" class="d" text-anchor="middle" >300</text>
<line x1="323.3" y1="560.0" x2="323.3" y2="120.0" class="grid" />
<text x="323.3" y="578.0" class="d" text-anchor="middle" >600</text>
<line x1="440.0" y1="560.0" x2="440.0" y2="120.0" class="grid" />
<text x="440.0" y="578.0" class="d" text-anchor="middle" >900</text>
<line x1="556.7" y1="560.0" x2="556.7" y2="120.0" class="grid" />
<text x="556.7" y="578.0" class="d" text-anchor="middle" >1,200</text>
<line x1="673.3" y1="560.0" x2="673.3" y2="120.0" class="grid" />
<text x="673.3" y="578.0" class="d" text-anchor="middle" >1,500</text>
<line x1="790.0" y1="560.0" x2="790.0" y2="120.0" class="grid" />
<text x="790.0" y="578.0" class="d" text-anchor="middle" >1,800</text>
<line x1="90.0" y1="560.0" x2="790.0" y2="560.0" class="grid" />
<text x="82.0" y="564.0" class="d" text-anchor="end" >0</text>
<line x1="90.0" y1="486.7" x2="790.0" y2="486.7" class="grid" />
<text x="82.0" y="490.7" class="d" text-anchor="end" >60</text>
<line x1="90.0" y1="413.3" x2="790.0" y2="413.3" class="grid" />
<text x="82.0" y="417.3" class="d" text-anchor="end" >120</text>
<line x1="90.0" y1="340.0" x2="790.0" y2="340.0" class="grid" />
<text x="82.0" y="344.0" class="d" text-anchor="end" >180</text>
<line x1="90.0" y1="266.7" x2="790.0" y2="266.7" class="grid" />
<text x="82.0" y="270.7" class="d" text-anchor="end" >240</text>
<line x1="90.0" y1="193.3" x2="790.0" y2="193.3" class="grid" />
<text x="82.0" y="197.3" class="d" text-anchor="end" >300</text>
<line x1="90.0" y1="120.0" x2="790.0" y2="120.0" class="grid" />
<text x="82.0" y="124.0" class="d" text-anchor="end" >360</text>
<line x1="90.0" y1="560.0" x2="790.0" y2="560.0" class="axis" />
<line x1="90.0" y1="560.0" x2="90.0" y2="120.0" class="axis" />
<text x="440.0" y="600.0" class="l" text-anchor="middle" >流量 Q（m³/h）</text>
<text x="30.0" y="106.0" class="l" text-anchor="start" >Δp（Pa）</text>
