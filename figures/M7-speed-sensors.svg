<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">風速感測器（氣壓計）</title>
<desc id="desc">兩顆 BMP280 各封在底片盒裡、包泡棉放在電子板上；紅管接穩定段靜壓環、藍管接測試段入口靜壓環，不用三通。</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b7280"/></marker>
<marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#187c91"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<pattern id="hc" width="5" height="8" patternUnits="userSpaceOnUse"><path d="M0 0V8 M0 4H5" stroke="#8aa4b2" stroke-width="0.8"/></pattern>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#94a3b8" stroke-width="1"/></pattern>
<style>
text{font-family:'PingFang TC','Heiti TC','Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#183344}
.t{font-size:24px;font-weight:700} .st{font-size:14px;fill:#526b7b}
.l{font-size:14px;font-weight:600} .n{font-size:12px;fill:#526b7b} .d{font-size:12px;fill:#374151}
.w{font-size:12px;fill:#c2410c;font-weight:600}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.shell{stroke:#32566b;stroke-width:2;fill:#edf3f6}
.shell0{stroke:#32566b;stroke-width:2;fill:none}
.thin{stroke:#32566b;stroke-width:1;fill:none}
.pc{stroke:#32566b;stroke-width:2;fill:#e3f1f7}
.solid{stroke:#32566b;stroke-width:1.2;fill:#cbd5df}
.dark{stroke:#1f2937;stroke-width:1;fill:#4b5563}
.car{stroke:#475569;stroke-width:1.2;fill:#e2e8f0}
.air{stroke:#187c91;stroke-width:2;fill:none}
.airf{fill:#187c91}
.scr{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.dim{stroke:#6b7280;stroke-width:1;fill:none}
.ext{stroke:#9ca3af;stroke-width:0.8;fill:none}
.guide{stroke:#cbd5e1;stroke-width:0.8;stroke-dasharray:3 4;fill:none}
.tbd{stroke:#c2410c;stroke-width:1.4;stroke-dasharray:5 3;fill:none}
.tbdf{stroke:#c2410c;stroke-width:1.4;stroke-dasharray:5 3;fill:#fff7ed}
.cl{stroke:#94a3b8;stroke-width:1;stroke-dasharray:14 4 2 4;fill:none}
.grid{stroke:#e5e7eb;stroke-width:1;fill:none}
.axis{stroke:#374151;stroke-width:1.2;fill:none}
.c1{stroke:#187c91;stroke-width:2.5;fill:none} .c2{stroke:#7c3aed;stroke-width:2.5;fill:none}
.c3{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.bar{fill:#187c91} .bar2{fill:#94a3b8}
.hc{fill:url(#hc);stroke:#32566b;stroke-width:1}
</style></defs>
<rect width="1400" height="900" rx="14" fill="#fafcfd"/>
<text x="32.0" y="42.0" class="t" text-anchor="start" >圖 M7　風速感測器：兩顆 BMP280 氣壓計（不用三通）</text>
<text x="32.0" y="66.0" class="st" text-anchor="start" >紅管：穩定段靜壓環 → 高壓盒（0x77）　藍管：測試段入口靜壓環 → 低壓盒（0x76）　兩條直管、等長、不用三通</text>
<rect x="60.0" y="170.0" width="200.0" height="150.0" class="shell" />
<text x="160.0" y="250.0" class="l" text-anchor="middle" >穩定段</text>
<line x1="260.0" y1="170.0" x2="330.0" y2="210.0" class="shell0" />
<line x1="260.0" y1="320.0" x2="330.0" y2="280.0" class="shell0" />
<rect x="330.0" y="210.0" width="170.0" height="70.0" class="pc" />
<text x="415.0" y="250.0" class="l" text-anchor="middle" >測試段</text>
<circle cx="130.0" cy="320.0" r="5.0" class="shell" style="fill:#dc2626"/>
<circle cx="190.0" cy="320.0" r="5.0" class="shell" style="fill:#dc2626"/>
<text x="160.0" y="160.0" class="n" text-anchor="middle" >靜壓環 ×4（x = −420）</text>
<circle cx="360.0" cy="280.0" r="5.0" class="shell" style="fill:#2563eb"/>
<circle cx="390.0" cy="280.0" r="5.0" class="shell" style="fill:#2563eb"/>
<text x="415.0" y="200.0" class="n" text-anchor="middle" >靜壓環 ×4（x = 30）</text>
<path d="M160,320 L160,440 L560,440" class="thin" style="stroke:#dc2626;stroke-width:3;fill:none"/>
<path d="M375,280 L375,500 L560,500" class="thin" style="stroke:#2563eb;stroke-width:3;fill:none"/>
<rect x="540.0" y="380.0" width="470.0" height="220.0" class="shell" rx="8" style="fill:#f5efe3"/>
<text x="560.0" y="404.0" class="l" text-anchor="start" >電子板（H5）</text>
<rect x="556.0" y="432.0" width="24.0" height="16.0" class="solid" />
<rect x="556.0" y="492.0" width="24.0" height="16.0" class="solid" />
<text x="556.0" y="625.0" class="n" text-anchor="start" >快接頭（搬運時拔開）</text>
<path d="M580,440 L700,440 L700,460" class="thin" style="stroke:#dc2626;stroke-width:3;fill:none"/>
<path d="M580,500 L640,500 L640,420 L790,420 L790,460" class="thin" style="stroke:#2563eb;stroke-width:3;fill:none"/>
<rect x="660.0" y="450.0" width="190.0" height="130.0" class="tbdf" rx="10"/>
<text x="755.0" y="596.0" class="n" text-anchor="middle" >泡棉包住兩盒 → 溫度相同</text>
<rect x="668.0" y="468.0" width="64.0" height="96.0" class="shell" rx="10"/>
<rect x="680.0" y="500.0" width="40.0" height="24.0" class="solid" />
<text x="700.0" y="545.0" class="n" text-anchor="middle" >高壓 0x77</text>
<rect x="758.0" y="468.0" width="64.0" height="96.0" class="shell" rx="10"/>
<rect x="770.0" y="500.0" width="40.0" height="24.0" class="solid" />
<text x="790.0" y="545.0" class="n" text-anchor="middle" >低壓 0x76</text>
<rect x="900.0" y="450.0" width="90.0" height="60.0" class="shell" rx="6" style="fill:#e0f2fe"/>
<text x="945.0" y="485.0" class="l" text-anchor="middle" >Uno</text>
<path d="M822,530 L870,530 L870,480 L900,480" class="thin" style="stroke:#16a34a;stroke-width:2.5;fill:none"/>
<text x="945.0" y="530.0" class="n" text-anchor="middle" >I²C（A4/A5）</text>
<text x="1010.0" y="140.0" class="l" text-anchor="start" >一個壓力盒（剖面）</text>
<rect x="1040.0" y="190.0" width="110.0" height="150.0" class="shell" rx="12"/>
<rect x="1065.0" y="255.0" width="60.0" height="30.0" class="solid" />
<text x="1095.0" y="275.0" class="n" text-anchor="middle" >BMP280</text>
<rect x="1088.0" y="168.0" width="14.0" height="22.0" class="solid" />
<text x="1110.0" y="182.0" class="n" text-anchor="start" >接管嘴</text>
<line x1="1095.0" y1="340.0" x2="1095.0" y2="380.0" class="thin" style="stroke:#111827;stroke-width:2"/>
<circle cx="1095.0" cy="343.0" r="6.0" class="dark" />
<text x="1160.0" y="210.0" class="n" text-anchor="start" >底片盒（35 mm）</text>
<text x="1160.0" y="228.0" class="n" text-anchor="start" >只留一個管嘴</text>
<text x="1160.0" y="246.0" class="n" text-anchor="start" >BMP280 模組（5 V 可用）</text>
<text x="1160.0" y="264.0" class="n" text-anchor="start" >電線孔用熱熔膠封</text>
<text x="60.0" y="660.0" class="n" text-anchor="start" >歸零後誤差約 ±0.7 Pa（雜訊平均 1 s ＋ 兩顆溫差 0.3 K）</text>
<text x="60.0" y="680.0" class="n" text-anchor="start" >→ 12 m/s 風速誤差 ±0.4%，5 m/s 約 ±2.5%</text>
<text x="60.0" y="700.0" class="n" text-anchor="start" >兩顆出廠差約 ±12 Pa：每次開風扇前一定要歸零</text>
<text x="60.0" y="720.0" class="n" text-anchor="start" >另外提供室內氣壓與溫度（算空氣密度）</text>
<text x="720.0" y="660.0" class="n" text-anchor="start" >管線約 0.5 m、兩條等長；平時接壁面靜壓環控制風速</text>
<text x="720.0" y="680.0" class="n" text-anchor="start" >校正 k：同一 PWM 先讀壁面環，再把兩條管換接皮托管讀一次；</text>
<text x="720.0" y="700.0" class="n" text-anchor="start" >k = q 皮托 ÷ Δp 壁面環；做 3 個 PWM</text>
<text x="720.0" y="720.0" class="n" text-anchor="start" >歸零 2 分鐘內漂移 &gt; 2 Pa → 改用 C（買 ABP2 差壓計）</text>
</svg>
