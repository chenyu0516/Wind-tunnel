<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc">
<title id="title">Wheel saddles and balance</title>
<desc id="desc">Top: one wheel's V-saddle cross-section (to scale); bottom: balance box and two-load-cell series balance (schematic).</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b7280"/></marker>
<marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#187c91"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<pattern id="hc" width="5" height="8" patternUnits="userSpaceOnUse"><path d="M0 0V8 M0 4H5" stroke="#8aa4b2" stroke-width="0.8"/></pattern>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#94a3b8" stroke-width="1"/></pattern>
<style>
text{font-family:'PingFang TC','Heiti TC','Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#183344}
.t{font-size:24px;font-weight:700} .st{font-size:14px;fill:#526b7b}
.l{font-size:14px;font-weight:600} .n{font-size:12px;fill:#526b7b} .d{font-size:12px;fill:#374151}
.w{font-size:12px;fill:#c2410c;font-weight:600}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.shell{stroke:#32566b;stroke-width:2;fill:#edf3f6}
.shell0{stroke:#32566b;stroke-width:2;fill:none}
.thin{stroke:#32566b;stroke-width:1;fill:none}
.pc{stroke:#32566b;stroke-width:2;fill:#e3f1f7}
.solid{stroke:#32566b;stroke-width:1.2;fill:#cbd5df}
.dark{stroke:#1f2937;stroke-width:1;fill:#4b5563}
.car{stroke:#475569;stroke-width:1.2;fill:#e2e8f0}
.air{stroke:#187c91;stroke-width:2;fill:none}
.airf{fill:#187c91}
.scr{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.dim{stroke:#6b7280;stroke-width:1;fill:none}
.ext{stroke:#9ca3af;stroke-width:0.8;fill:none}
.guide{stroke:#cbd5e1;stroke-width:0.8;stroke-dasharray:3 4;fill:none}
.tbd{stroke:#c2410c;stroke-width:1.4;stroke-dasharray:5 3;fill:none}
.tbdf{stroke:#c2410c;stroke-width:1.4;stroke-dasharray:5 3;fill:#fff7ed}
.cl{stroke:#94a3b8;stroke-width:1;stroke-dasharray:14 4 2 4;fill:none}
.grid{stroke:#e5e7eb;stroke-width:1;fill:none}
.axis{stroke:#374151;stroke-width:1.2;fill:none}
.c1{stroke:#187c91;stroke-width:2.5;fill:none} .c2{stroke:#7c3aed;stroke-width:2.5;fill:none}
.c3{stroke:#187c91;stroke-width:2;stroke-dasharray:6 4;fill:none}
.bar{fill:#187c91} .bar2{fill:#94a3b8}
.hc{fill:url(#hc);stroke:#32566b;stroke-width:1}
</style></defs>
<rect width="1400" height="1180" rx="14" fill="#fafcfd"/>
<text x="32.0" y="42.0" class="t" text-anchor="start" >Figure M4  Wheel V-saddle and balance (section)</text>
<text x="32.0" y="66.0" class="st" text-anchor="start" >Top half to scale (one wheel, side view); bottom half schematic, not to scale   mm</text>
<rect x="80.0" y="352.0" width="176.0" height="33.0" class="solid" />
<rect x="476.0" y="352.0" width="176.0" height="33.0" class="solid" />
<rect x="80.0" y="110.0" width="572.0" height="205.7" class="car" />
<circle cx="366.0" cy="273.1" r="88.0" class="dark" style="fill:#4b5563;opacity:0.85"/>
<text x="366.0" y="278.1" class="l" text-anchor="middle" style="fill:#ffffff">Tyre Ø16</text>
<polygon points="305.5,344.2 334.6,355.3 366.0,367.3 397.4,355.3 426.5,344.2 426.5,421.3 305.5,421.3" class="shell" style="fill:#cbd5df"/>
<circle cx="334.6" cy="355.3" r="4.0" class="shell" style="fill:#7c3aed"/>
<line x1="334.6" y1="355.3" x2="366.0" y2="273.1" class="guide" style="stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:6 4"/>
<circle cx="397.4" cy="355.3" r="4.0" class="shell" style="fill:#7c3aed"/>
<line x1="397.4" y1="355.3" x2="366.0" y2="273.1" class="guide" style="stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:6 4"/>
<path d="M223.0,385.0 L223.0,517.0 L338.5,517.0 M393.5,517.0 L509.0,517.0 L509.0,385.0" class="shell0" style="stroke-width:2.5"/>
<rect x="338.5" y="517.0" width="5.5" height="99.0" class="solid" />
<rect x="388.0" y="517.0" width="5.5" height="99.0" class="solid" />
<rect x="349.5" y="421.3" width="33.0" height="249.7" class="solid" style="fill:#94a3b8"/>
<rect x="80.0" y="616.0" width="253.0" height="33.0" class="solid" />
<rect x="399.0" y="616.0" width="253.0" height="33.0" class="solid" />
<line x1="666.0" y1="616.0" x2="666.0" y2="385.0" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="672.0" y="504.5" class="d halo" text-anchor="start" >Under plate 21</text>
<line x1="776.0" y1="517.0" x2="776.0" y2="385.0" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="782.0" y="455.0" class="d halo" text-anchor="start" >Well ≤ 12</text>
<line x1="776.0" y1="616.0" x2="776.0" y2="517.0" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="782.0" y="570.5" class="d halo" text-anchor="start" >Shroud 9</text>
<text x="670.0" y="350.0" class="d halo" text-anchor="start" >Plate 3</text>
<text x="297.5" y="437.8" class="l halo" text-anchor="end" >V-saddle</text>
<text x="217.0" y="462.0" class="l halo" text-anchor="end" >Closed wheel well</text>
<text x="332.5" y="572.0" class="n halo" text-anchor="end" >Shroud tube Ø5 (fixed to tunnel)</text>
<text x="390.5" y="649.0" class="n halo" text-anchor="start" >Post Ø3 (part of balance)</text>
<text x="860.0" y="140.0" class="l" text-anchor="start" >Saddle geometry</text>
<text x="860.0" y="166.0" class="d" text-anchor="start" >Contact faces at 20.9° to horizontal (forces at 20.9° to vertical)</text>
<text x="860.0" y="186.0" class="d" text-anchor="start" >Push-out condition: horizontal force / weight = tan φ = 0.38</text>
<text x="860.0" y="206.0" class="d" text-anchor="start" >Tyre bottom 0.53 mm below the contact points</text>
<text x="860.0" y="226.0" class="d" text-anchor="start" >Rule: contacts below plate top; set pitch with saddle shims only</text>
<text x="860.0" y="246.0" class="d" text-anchor="start" >Saddles 3D-printed (PETG) or milled aluminium</text>
<text x="860.0" y="290.0" class="w" text-anchor="start" >Open: ride height drops about 0.5 mm</text>
<text x="860.0" y="309.0" class="w" text-anchor="start" >(1:43 ride height about 3 mm, about 18%)</text>
<text x="860.0" y="328.0" class="w" text-anchor="start" >Record the actual ride height</text>
<line x1="40.0" y1="686.0" x2="1360.0" y2="686.0" class="guide" />
<text x="40.0" y="706.0" class="w" text-anchor="start" >Schematic, not to scale: below the test-section floor</text>
<path d="M140,740 L140,1040 L720,1040 L720,740" class="shell0" style="stroke-width:4"/>
<rect x="136.0" y="734.0" width="588.0" height="6.0" class="solid" />
<text x="732.0" y="758.0" class="l" text-anchor="start" >Balance box 180×168×86 (walls are the test-section side panels, 3 mm acrylic)</text>
<text x="732.0" y="780.0" class="n" text-anchor="start" >Open to the test section only through the wheel wells; no vent tube</text>
<rect x="140.0" y="1028.0" width="580.0" height="12.0" class="solid" style="fill:#d6c3a1"/>
<text x="732.0" y="1038.0" class="n" text-anchor="start" >Floor = removable tray; the whole balance is bolted to it</text>
<circle cx="720.0" cy="890.0" r="6.0" class="shell" />
<text x="732.0" y="894.0" class="n" text-anchor="start" >Cable hole (hot-glue sealed) → HX711 ×2 outside</text>
<rect x="164.0" y="1040.0" width="12.0" height="22.0" class="dark" />
<rect x="684.0" y="1040.0" width="12.0" height="22.0" class="dark" />
<text x="700.0" y="1092.0" class="n" text-anchor="start" >M6 levelling feet ×4 (in the tray)</text>
<line x1="330.0" y1="710.0" x2="330.0" y2="810.0" class="dark" style="stroke-width:5;stroke:#94a3b8"/>
<line x1="560.0" y1="710.0" x2="560.0" y2="810.0" class="dark" style="stroke-width:5;stroke:#94a3b8"/>
<text x="568.0" y="722.0" class="n" text-anchor="start" >Posts ×4</text>
<rect x="250.0" y="810.0" width="380.0" height="14.0" class="solid" style="fill:#d6c3a1"/>
<text x="732.0" y="822.0" class="n" text-anchor="start" >Common frame (2 × 3 mm plywood)</text>
<rect x="300.0" y="824.0" width="40.0" height="12.0" class="shell" style="fill:#f59e0b"/>
<rect x="300.0" y="836.0" width="300.0" height="20.0" class="shell" style="fill:#fde68a"/>
<text x="450.0" y="851.0" class="n" text-anchor="middle" >Vertical load cell 1 kg (lies flat)</text>
<path d="M540,856 L620,856 L620,890 L600,890 L600,868 L540,868 Z" class="shell" style="fill:#f59e0b"/>
<text x="535.0" y="886.0" class="n" text-anchor="end" >Corner bracket (3D-printed)</text>
<rect x="580.0" y="890.0" width="20.0" height="110.0" class="shell" style="fill:#fde68a"/>
<text x="572.0" y="940.0" class="n" text-anchor="end" >Drag load cell 100 g (stands up)</text>
<text x="572.0" y="958.0" class="n" text-anchor="end" >senses fore-aft</text>
<rect x="552.0" y="986.0" width="28.0" height="18.0" class="shell" style="fill:#f59e0b"/>
<rect x="220.0" y="1014.0" width="440.0" height="14.0" class="solid" style="fill:#d6c3a1"/>
<text x="400.0" y="1010.0" class="n" text-anchor="start" >Balance base plate</text>
<rect x="262.0" y="840.0" width="22.0" height="174.0" class="shell" style="fill:#f59e0b"/>
<rect x="259.0" y="828.0" width="28.0" height="6.0" class="dark" />
<text x="256.0" y="880.0" class="n" text-anchor="end" >Down-stop M4 screw (0.3 mm gap)</text>
<text x="148.0" y="1120.0" class="n" text-anchor="start" >Load path: car → saddles → posts → frame → vertical cell → corner bracket → drag cell → base → tray</text>
<rect x="60.0" y="1062.0" width="1280.0" height="12.0" class="solid" style="fill:url(#hatch)"/>
<text x="70.0" y="1058.0" class="n" text-anchor="start" >Desk</text>
<text x="960.0" y="926.0" class="n" text-anchor="start" >Stops: drag 0.6 N, vertical 0.9 kg</text>
<text x="960.0" y="944.0" class="n" text-anchor="start" >Moving mass ≤ 0.6 kg</text>
<text x="960.0" y="962.0" class="n" text-anchor="start" >Drag-direction natural frequency about 14 Hz</text>
<text x="960.0" y="980.0" class="n" text-anchor="start" >The drag cell carries all the drag (no slide)</text>
<text x="960.0" y="998.0" class="n" text-anchor="start" >Needs a 2 × 2 crosstalk calibration</text>
<text x="960.0" y="1016.0" class="n" text-anchor="start" >Fore-aft stops: fork + 2 M3 screws (0.3 mm gap)</text>
</svg>
