<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title desc">
<title id="title">Fan and system curves</title>
<desc id="desc">Estimated curves of 8 × 120 mm fans (4 stacks of two in series) at different PWM and where they meet the mini tunnel's system curve.</desc>
