<text x="850.0" y="130.0" class="l" text-anchor="start" >How to read it</text>
<text x="850.0" y="156.0" class="d" text-anchor="start" >Purple: fan pressure (slower → lower left)</text>
<text x="850.0" y="177.0" class="d" text-anchor="start" >Blue: pressure the tunnel needs at each flow</text>
<text x="850.0" y="198.0" class="d" text-anchor="start" >Crossing: the speed the tunnel will actually run</text>
<text x="850.0" y="219.0" class="d" text-anchor="start" ></text>
<text x="850.0" y="240.0" class="d" text-anchor="start" >5 m/s needs about 34% PWM</text>
<text x="850.0" y="261.0" class="d" text-anchor="start" >10 m/s needs about 67% PWM (class demo)</text>
<text x="850.0" y="282.0" class="d" text-anchor="start" >14 m/s needs about 94% PWM</text>
<text x="850.0" y="303.0" class="d" text-anchor="start" ></text>
<text x="850.0" y="324.0" class="d" text-anchor="start" >PWM is only a starting point: the Arduino reads</text>
<text x="850.0" y="345.0" class="d" text-anchor="start" >the pressure and its PID trims to the target</text>
<text x="850.0" y="366.0" class="d" text-anchor="start" ></text>
<text x="850.0" y="387.0" class="d" text-anchor="start" >The system loss is an estimate:</text>
<text x="850.0" y="408.0" class="d" text-anchor="start" >top speed is only about 6% over 14 m/s;</text>
<text x="850.0" y="429.0" class="d" text-anchor="start" >if short, switch to 4 × PFC1212DE;</text>
<text x="850.0" y="450.0" class="d" text-anchor="start" >sweep PWM once after building to measure them</text>
</svg>
